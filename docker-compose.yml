# Desenvolvimento local: banco PostgreSQL 16 e armazenamento compatível com S3.
# Uso: docker compose up -d && npm run db:migrate && npm run db:seed && npm run dev
services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_DB: soluccini
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_DB_PASSWORD: troque-esta-senha
      TZ: America/Sao_Paulo
    ports: ["5432:5432"]
    volumes:
      - dados-db:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  s3:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: soluccini
      MINIO_ROOT_PASSWORD: troque-esta-senha
    ports: ["9000:9000", "9001:9001"]
    volumes: [dados-s3:/data]

volumes:
  dados-db:
  dados-s3:
